<!-- PROTOTYPE — Selected settings-page direction: catalog and detail. Throwaway UI for design validation. -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据服务平台 · 设置原型</title>
  <style>
    :root {
      --ds-color-white: #ffffff;
      --ds-color-black: #000000;
      --ds-color-primary-1: #e8f3ff;
      --ds-color-primary-2: #bedaff;
      --ds-color-primary-3: #94bfff;
      --ds-color-primary-4: #6aa1ff;
      --ds-color-primary-5: #4080ff;
      --ds-color-primary-6: #165dff;
      --ds-color-primary-7: #0e42d2;
      --ds-color-primary-8: #072ca6;
      --ds-color-gray-1: #f7f8fa;
      --ds-color-gray-2: #f2f3f5;
      --ds-color-gray-3: #e5e6eb;
      --ds-color-gray-4: #c9cdd4;
      --ds-color-gray-5: #a9aeb8;
      --ds-color-gray-6: #86909c;
      --ds-color-gray-7: #6b7785;
      --ds-color-gray-8: #4e5969;
      --ds-color-gray-9: #272e3b;
      --ds-color-gray-10: #1d2129;
      --ds-color-success: #00b42a;
      --ds-color-success-light: #e8ffea;
      --ds-color-success-text: #087a24;
      --ds-color-warning: #ff7d00;
      --ds-color-warning-light: #fff7e8;
      --ds-color-warning-text: #a84b00;
      --ds-color-danger: #f53f3f;
      --ds-color-danger-light: #ffece8;
      --ds-color-danger-text: #cb2634;
      --ds-bg-canvas: var(--ds-color-gray-2);
      --ds-bg-surface: var(--ds-color-white);
      --ds-bg-elevated: var(--ds-color-white);
      --ds-bg-fill: var(--ds-color-gray-2);
      --ds-bg-fill-hover: var(--ds-color-gray-3);
      --ds-text-1: var(--ds-color-gray-10);
      --ds-text-2: var(--ds-color-gray-8);
      --ds-text-3: var(--ds-color-gray-6);
      --ds-text-4: var(--ds-color-gray-4);
      --ds-border-1: var(--ds-color-gray-2);
      --ds-border-2: var(--ds-color-gray-3);
      --ds-border-3: var(--ds-color-gray-4);
      --ds-focus-ring: 0 0 0 2px rgb(22 93 255 / 18%);
      --ds-mask: rgb(29 33 41 / 60%);
      --ds-font-sans: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      --ds-font-mono: Consolas, Menlo, Monaco, monospace;
      --ds-font-size-12: 12px;
      --ds-font-size-14: 14px;
      --ds-font-size-16: 16px;
      --ds-font-size-20: 20px;
      --ds-font-size-24: 24px;
      --ds-font-size-36: 36px;
      --ds-font-weight-regular: 400;
      --ds-font-weight-medium: 500;
      --ds-font-weight-semibold: 600;
      --ds-line-height-base: 1.5715;
      --ds-line-height-tight: 1.35;
      --ds-space-0: 0;
      --ds-space-1: 2px;
      --ds-space-2: 4px;
      --ds-space-3: 6px;
      --ds-space-4: 8px;
      --ds-space-5: 10px;
      --ds-space-6: 12px;
      --ds-space-7: 16px;
      --ds-space-8: 20px;
      --ds-space-9: 24px;
      --ds-space-10: 32px;
      --ds-space-11: 36px;
      --ds-space-12: 40px;
      --ds-space-13: 48px;
      --ds-space-16: 64px;
      --ds-radius-none: 0;
      --ds-radius-small: 2px;
      --ds-radius-medium: 4px;
      --ds-radius-large: 8px;
      --ds-radius-circle: 50%;
      --ds-shadow-none: none;
      --ds-shadow-1: 0 2px 5px rgb(0 0 0 / 10%);
      --ds-shadow-2: 0 4px 10px rgb(0 0 0 / 10%);
      --ds-shadow-3: 0 8px 20px rgb(0 0 0 / 10%);
      --ds-duration-fast: 100ms;
      --ds-duration-base: 200ms;
      --ds-duration-slow: 300ms;
      --ds-ease-standard: cubic-bezier(0.34, 0.69, 0.1, 1);
      --ds-control-mini: 24px;
      --ds-control-small: 28px;
      --ds-control-default: 32px;
      --ds-control-large: 36px;
      --ds-nav-height: 60px;
      --ds-sidebar-width: 220px;
      --ds-desktop-min: 1200px;
      --ds-content-max: 1440px;
      --ds-grid-gutter: 16px;
      --ds-page-padding: 24px;
      --ds-z-popup: 1000;
      --ds-z-modal: 1001;
      --ds-z-message: 1003;
      --ds-button-height: var(--ds-control-default);
      --ds-button-radius: var(--ds-radius-small);
      --ds-button-padding-inline: 15px;
      --ds-input-height: var(--ds-control-default);
      --ds-input-radius: var(--ds-radius-small);
      --ds-form-item-gap: 20px;
      --ds-table-cell-padding-inline: 16px;
      --ds-table-cell-padding-block: 9px;
      --ds-pagination-item-size: 32px;
      --ds-modal-width: 520px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-width: var(--ds-desktop-min);
      overflow: hidden;
      color: var(--ds-text-1);
      background: var(--ds-bg-canvas);
      font-family: var(--ds-font-sans);
      font-size: var(--ds-font-size-14);
      line-height: var(--ds-line-height-base);
    }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { outline: none; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      box-shadow: var(--ds-focus-ring);
    }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .icon { width: 16px; height: 16px; display: inline-block; flex: 0 0 auto; }
    .icon-sm { width: 14px; height: 14px; }

    .topbar {
      position: fixed;
      z-index: 30;
      inset: 0 0 auto 0;
      height: var(--ds-nav-height);
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--ds-border-2);
      background: var(--ds-bg-surface);
    }
    .product-area {
      width: var(--ds-sidebar-width);
      height: 100%;
      display: flex;
      align-items: center;
      gap: var(--ds-space-6);
      padding: 0 var(--ds-space-8);
      border-right: 1px solid var(--ds-border-2);
      font-size: var(--ds-font-size-16);
      font-weight: var(--ds-font-weight-semibold);
    }
    .product-symbol {
      width: var(--ds-control-default);
      height: var(--ds-control-default);
      display: grid;
      place-items: center;
      border-radius: var(--ds-radius-medium);
      color: var(--ds-color-white);
      background: var(--ds-color-primary-6);
    }
    .top-domain {
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 var(--ds-space-9);
      border-bottom: 2px solid var(--ds-color-primary-6);
      color: var(--ds-color-primary-6);
      font-weight: var(--ds-font-weight-medium);
    }
    .top-spacer { flex: 1; }
    .top-actions { display: flex; align-items: center; gap: var(--ds-space-4); padding-right: var(--ds-space-8); }
    .top-icon, .user-chip {
      min-height: var(--ds-control-large);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--ds-space-4);
      border: 0;
      border-radius: var(--ds-radius-medium);
      color: var(--ds-text-2);
      background: transparent;
    }
    .top-icon { width: var(--ds-control-large); }
    .user-chip { padding: 0 var(--ds-space-5); }
    .top-icon:hover, .user-chip:hover { background: var(--ds-bg-fill); }
    .avatar {
      width: var(--ds-control-small);
      height: var(--ds-control-small);
      display: grid;
      place-items: center;
      border-radius: var(--ds-radius-circle);
      color: var(--ds-color-primary-7);
      background: var(--ds-color-primary-1);
      font-size: var(--ds-font-size-12);
      font-weight: var(--ds-font-weight-medium);
    }

    .sidebar {
      position: fixed;
      z-index: 20;
      top: var(--ds-nav-height);
      bottom: 0;
      left: 0;
      width: var(--ds-sidebar-width);
      overflow-y: auto;
      border-right: 1px solid var(--ds-border-2);
      background: var(--ds-bg-surface);
      padding: var(--ds-space-6) var(--ds-space-4);
    }
    .nav-item {
      width: 100%;
      min-height: var(--ds-control-large);
      display: flex;
      align-items: center;
      gap: var(--ds-space-6);
      padding: 0 var(--ds-space-6);
      border: 0;
      border-radius: var(--ds-radius-small);
      color: var(--ds-text-2);
      background: transparent;
      text-align: left;
      transition: background var(--ds-duration-fast) var(--ds-ease-standard), color var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .nav-item + .nav-item { margin-top: var(--ds-space-2); }
    .nav-item:hover { color: var(--ds-text-1); background: var(--ds-bg-fill); }
    .nav-item.active {
      color: var(--ds-color-primary-7);
      background: var(--ds-color-primary-1);
      font-weight: var(--ds-font-weight-medium);
    }
    .nav-divider { height: 1px; margin: var(--ds-space-6); background: var(--ds-border-1); }

    .workspace {
      position: fixed;
      top: var(--ds-nav-height);
      right: 0;
      bottom: 0;
      left: var(--ds-sidebar-width);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .page-head {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--ds-space-9);
      padding: var(--ds-space-7) var(--ds-page-padding);
      border-bottom: 1px solid var(--ds-border-2);
      background: var(--ds-bg-surface);
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: var(--ds-space-4);
      margin-bottom: var(--ds-space-3);
      color: var(--ds-text-3);
      font-size: var(--ds-font-size-12);
    }
    h1 { margin: 0; font-size: var(--ds-font-size-24); line-height: var(--ds-line-height-tight); font-weight: var(--ds-font-weight-medium); }
    .page-description { margin: var(--ds-space-3) 0 0; color: var(--ds-text-3); }
    .manager-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--ds-space-3);
      min-height: var(--ds-control-small);
      padding: 0 var(--ds-space-5);
      border: 1px solid var(--ds-border-2);
      border-radius: var(--ds-radius-medium);
      color: var(--ds-text-2);
      background: var(--ds-bg-fill);
      font-size: var(--ds-font-size-12);
    }
    .page-scroll { flex: 1; min-height: 0; overflow: hidden; }
    .page-content {
      width: 100%;
      max-width: var(--ds-content-max);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      padding: var(--ds-page-padding);
    }
    #variant-root { height: 100%; min-height: 0; }
    .stack > * + * { margin-top: var(--ds-space-7); }

    .btn {
      min-height: var(--ds-button-height);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--ds-space-4);
      padding: 0 var(--ds-button-padding-inline);
      border: 1px solid var(--ds-border-3);
      border-radius: var(--ds-button-radius);
      color: var(--ds-text-1);
      background: var(--ds-bg-surface);
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--ds-color-primary-5); color: var(--ds-color-primary-6); }
    .btn-primary { border-color: var(--ds-color-primary-6); color: var(--ds-color-white); background: var(--ds-color-primary-6); }
    .btn-primary:hover { border-color: var(--ds-color-primary-7); color: var(--ds-color-white); background: var(--ds-color-primary-7); }
    .btn-danger { border-color: var(--ds-color-danger); color: var(--ds-color-danger-text); }
    .btn-danger:hover { color: var(--ds-color-white); background: var(--ds-color-danger); }
    .btn-text { min-height: var(--ds-control-small); padding: 0 var(--ds-space-3); border-color: transparent; color: var(--ds-color-primary-6); background: transparent; }
    .btn-text:hover { border-color: transparent; color: var(--ds-color-primary-7); background: var(--ds-color-primary-1); }
    .btn-small { min-height: var(--ds-control-small); padding: 0 var(--ds-space-5); font-size: var(--ds-font-size-12); }

    .panel, .table-card, .summary-card {
      border: 1px solid var(--ds-border-2);
      border-radius: var(--ds-radius-medium);
      background: var(--ds-bg-surface);
    }
    .panel { min-width: 0; padding: var(--ds-space-7); }
    .panel-head, .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--ds-space-7);
    }
    .panel-head { margin-bottom: var(--ds-space-6); }
    .table-toolbar { min-height: 52px; padding: 0 var(--ds-space-7); border-bottom: 1px solid var(--ds-border-2); }
    .panel-title, .table-title { margin: 0; font-size: var(--ds-font-size-16); font-weight: var(--ds-font-weight-medium); }
    .panel-copy { margin: var(--ds-space-2) 0 0; color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .panel-actions { display: flex; align-items: center; gap: var(--ds-space-4); }
    .table-card { overflow: hidden; }
    .table-scroll { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td {
      padding: var(--ds-table-cell-padding-block) var(--ds-table-cell-padding-inline);
      border-bottom: 1px solid var(--ds-border-1);
      vertical-align: middle;
      white-space: nowrap;
    }
    th { color: var(--ds-text-2); background: var(--ds-color-gray-1); font-weight: var(--ds-font-weight-medium); }
    tbody tr:hover { background: var(--ds-color-gray-1); }
    tbody tr:last-child td { border-bottom: 0; }
    .cell-main { color: var(--ds-text-1); font-weight: var(--ds-font-weight-medium); }
    .cell-sub { margin-top: var(--ds-space-1); color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .cell-wrap { min-width: 180px; max-width: 360px; white-space: normal; }
    .numeric { font-variant-numeric: tabular-nums; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: var(--ds-space-3);
      min-height: 22px;
      padding: 0 var(--ds-space-5);
      border-radius: var(--ds-radius-small);
      font-size: var(--ds-font-size-12);
      font-weight: var(--ds-font-weight-medium);
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: var(--ds-radius-circle); background: currentColor; }
    .status-success { color: var(--ds-color-success-text); background: var(--ds-color-success-light); }
    .status-warning { color: var(--ds-color-warning-text); background: var(--ds-color-warning-light); }
    .status-neutral { color: var(--ds-text-2); background: var(--ds-bg-fill); }
    .type-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 var(--ds-space-5);
      border-radius: var(--ds-radius-small);
      color: var(--ds-color-primary-7);
      background: var(--ds-color-primary-1);
      font-size: var(--ds-font-size-12);
    }
    .type-badge.asset { color: var(--ds-text-2); background: var(--ds-bg-fill); }
    .action-group { display: flex; align-items: center; gap: var(--ds-space-3); }

    .policy-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--ds-grid-gutter);
      padding: var(--ds-space-7);
      border-bottom: 1px solid var(--ds-border-1);
    }
    .policy-item { min-width: 0; }
    .policy-label { color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .policy-value { margin-top: var(--ds-space-3); font-size: var(--ds-font-size-16); font-weight: var(--ds-font-weight-medium); }
    .policy-note { margin-top: var(--ds-space-2); color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .inline-alert {
      padding: var(--ds-space-6);
      border: 1px solid var(--ds-color-primary-2);
      border-radius: var(--ds-radius-medium);
      color: var(--ds-color-primary-7);
      background: var(--ds-color-primary-1);
    }
    .inline-alert.warning { border-color: var(--ds-color-warning); color: var(--ds-color-warning-text); background: var(--ds-color-warning-light); }
    .inline-alert.danger { border-color: var(--ds-color-danger); color: var(--ds-color-danger-text); background: var(--ds-color-danger-light); }

    .catalog-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: var(--ds-grid-gutter);
      height: 100%;
      min-height: 0;
      align-items: stretch;
    }
    .settings-rail { height: 100%; min-height: 0; overflow-y: auto; padding: var(--ds-space-4); }
    .rail-intro { padding: var(--ds-space-6); }
    .rail-title { margin: 0; font-size: var(--ds-font-size-16); font-weight: var(--ds-font-weight-medium); }
    .rail-copy { margin: var(--ds-space-3) 0 0; color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .topic-button {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: var(--ds-space-5);
      padding: var(--ds-space-6);
      border: 0;
      border-radius: var(--ds-radius-medium);
      color: var(--ds-text-2);
      background: transparent;
      text-align: left;
    }
    .topic-button + .topic-button { margin-top: var(--ds-space-2); }
    .topic-button:hover { background: var(--ds-bg-fill); }
    .topic-button.active { color: var(--ds-color-primary-7); background: var(--ds-color-primary-1); }
    .topic-main { flex: 1; min-width: 0; }
    .topic-name { display: block; font-weight: var(--ds-font-weight-medium); }
    .topic-meta { display: block; margin-top: var(--ds-space-2); color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .detail-shell { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .detail-topline {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--ds-space-7);
      padding: var(--ds-space-7);
      border-bottom: 1px solid var(--ds-border-2);
    }
    .detail-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--ds-space-7); }
    .limit-note { margin: var(--ds-space-7) 0 0; color: var(--ds-text-2); font-size: var(--ds-font-size-12); }
    .limit-preview { margin: var(--ds-space-7) 0; padding-left: var(--ds-space-8); color: var(--ds-text-2); }
    .limit-preview li + li { margin-top: var(--ds-space-4); }
    .type-card-head .status { flex-shrink: 0; white-space: nowrap; }
    .type-card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ds-grid-gutter); }
    .type-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 168px;
      padding: var(--ds-space-6);
      border: 1px solid var(--ds-border-2);
      border-radius: var(--ds-radius-medium);
      background: var(--ds-bg-surface);
    }
    .type-card.is-hidden { background: var(--ds-color-gray-1); }
    .type-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--ds-space-6);
    }
    .type-card-copy { min-width: 0; }
    .type-title-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--ds-space-3); }
    .type-card-name {
      margin: 0;
      color: var(--ds-text-1);
      font-size: var(--ds-font-size-16);
      font-weight: var(--ds-font-weight-medium);
      line-height: var(--ds-line-height-tight);
    }
    .type-description {
      min-height: 40px;
      margin: var(--ds-space-3) 0 0;
      color: var(--ds-text-2);
      font-size: var(--ds-font-size-14);
      line-height: var(--ds-line-height-base);
    }
    .type-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--ds-space-4) var(--ds-space-6);
      margin-top: auto;
      padding-top: var(--ds-space-5);
      border-top: 1px solid var(--ds-border-1);
    }
    .type-card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--ds-space-3); }
    .type-product-count { color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .type-actions { display: flex; align-items: center; gap: var(--ds-space-3); margin-left: auto; }

    .drawer-layer, .modal-layer {
      position: fixed;
      z-index: var(--ds-z-modal);
      inset: 0;
      display: none;
    }
    .drawer-layer.open, .modal-layer.open { display: block; }
    .mask { position: absolute; inset: 0; background: var(--ds-mask); }
    .drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: min(560px, 48vw);
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: var(--ds-shadow-3);
      background: var(--ds-bg-elevated);
    }
    .drawer .settings-group { padding: var(--ds-space-7); }
    .drawer-head, .modal-head {
      display: flex;
      align-items: center;

      function escapeHtml(value) {

          return '<section class="table-card detail-shell" aria-labelledby="detail-b-title">' +
            '<div class="detail-topline"><div><h2 class="table-title" id="detail-b-title">认证与密钥策略</h2><p class="panel-copy">按认证方式维护数据应用的凭据有效期与接受边界。</p></div><span class="status status-neutral">原型示例</span></div>' +
            '<div class="detail-body settings-body">' + commonPolicyForm() + '</div>' + settingsFooter('data-save-common') + '</section>';
        }
        if (state.variantBTopic === "limits") {
          return '<section class="table-card detail-shell" aria-labelledby="detail-b-title">' +
            '<div class="detail-topline"><div><h2 class="table-title" id="detail-b-title">类型专属限制</h2><p class="panel-copy">查看各类型限制摘要，编辑完整配置。</p></div><span class="status status-neutral">原型示例</span></div>' +
            '<div class="detail-body"><div class="type-card-grid">' + renderLimitCards() + '</div></div></section>';
        }
        return '<section class="table-card detail-shell" aria-labelledby="detail-b-title">' +
          '<div class="detail-topline"><div><h2 class="table-title" id="detail-b-title">集市产品类型</h2><p class="panel-copy">以可扫描卡片维护展示名称、说明、排序和呈现状态。</p></div></div>' +
          '<div class="detail-body"><div class="type-card-grid">' + renderTypeCards() + '</div></div></section>';
      }

      function renderVariantB() {
        return '<div class="catalog-layout">' +
            '<aside class="panel settings-rail" aria-label="设置主题"><div class="rail-intro"><h2 class="rail-title">设置目录</h2><p class="rail-copy">面向管理者的域级共用配置。</p></div>' +
              '<button class="topic-button ' + (state.variantBTopic === "types" ? "active" : "") + '" aria-pressed="' + (state.variantBTopic === "types") + '" type="button" data-topic="types"><span class="topic-main"><span class="topic-name">集市产品类型</span><span class="topic-meta">8 类 · ' + state.types.filter(function (item) { return item.shown; }).length + ' 类对外呈现</span></span></button>' +
              '<button class="topic-button ' + (state.variantBTopic === "auth" ? "active" : "") + '" aria-pressed="' + (state.variantBTopic === "auth") + '" type="button" data-topic="auth"><span class="topic-main"><span class="topic-name">认证与密钥策略</span><span class="topic-meta">认证方式 · 凭据有效期</span></span></button>' +
              '<button class="topic-button ' + (state.variantBTopic === "limits" ? "active" : "") + '" aria-pressed="' + (state.variantBTopic === "limits") + '" type="button" data-topic="limits"><span class="topic-main"><span class="topic-name">类型专属限制</span><span class="topic-meta">7 类产品 · 调用与执行上限</span></span></button>' +
            '</aside>' +
            renderVariantBDetail() +
          '</div>';
      }

      function formatLimit(value) {
        return Number(value).toLocaleString("zh-CN");
      }



      function render() {
        hideHelp();
        root.innerHTML = renderVariantB();
        if (state.variantBTopic === "auth") syncAuthAvailability(false);
        document.querySelector(".page-scroll").scrollTop = 0;
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toastText.textContent = message;
        toast.classList.add("show");
        toastTimer = window.setTimeout(function () { toast.classList.remove("show"); }, 2400);
      }

      function openDrawer(title, body, footer) {
        hideHelp();
        drawerLayer.setAttribute("data-placement", "right");
        drawerTitle.textContent = title;
        drawerBody.innerHTML = body;
        drawerFooter.innerHTML = footer || '<button class="btn" type="button" data-close-drawer>关闭</button>';
        drawerLayer.classList.add("open");
        drawerLayer.setAttribute("aria-hidden", "false");
        window.setTimeout(function () {
          var first = drawerLayer.querySelector("input:not(:disabled), select, textarea, button");
          if (first) first.focus();
        }, 20);
      }

      function closeDrawer() {
        hideHelp();
        drawerLayer.classList.remove("open");
        drawerLayer.setAttribute("aria-hidden", "true");
        drawerLimitId = null;
        drawerBody.innerHTML = "";
        drawerFooter.innerHTML = "";
      }

      function requestDrawerClose() {
        if (drawerLimitId && hasUnsavedSettings()) {
          openModal("放弃未保存的更改？", '<p class="modal-copy">关闭后将丢弃当前类型尚未保存的修改。</p>', "放弃更改", function () {
            closeModal();
            closeDrawer();
          }, true);
        } else {
          closeDrawer();
        }
      }

      function openModal(title, body, confirmLabel, action, danger) {
        hideHelp();
        modalTitle.textContent = title;
        modalBody.innerHTML = body;
        modalConfirm.textContent = confirmLabel || "确认";
        modalConfirm.className = danger ? "btn btn-danger" : "btn btn-primary";
        modalAction = action;
        modalLayer.classList.add("open");
        modalLayer.setAttribute("aria-hidden", "false");
        window.setTimeout(function () { modalConfirm.focus(); }, 20);
      }

      function closeModal() {
        modalLayer.classList.remove("open");
        modalLayer.setAttribute("aria-hidden", "true");
        modalAction = null;
      }

      function editType(id) {
        var type = getType(id);
        var body = '<div class="form-grid">' +
          '<div class="form-item">' + fieldLabel("type-code", "内部类型", "运行语义和配置结构由平台固定；内部编码只在编辑时只读显示，不展示在卡片标题旁。") + '<input class="input" id="type-code" value="' + escapeHtml(type.code) + '" aria-describedby="help-type-code" disabled></div>' +
          '<div class="form-item"><label for="type-order">展示顺序</label><input class="input" id="type-order" type="number" min="1" max="99" value="' + type.order + '"></div>' +
          '<div class="form-item full"><label for="type-name">展示名称</label><input class="input" id="type-name" value="' + escapeHtml(type.name) + '" aria-describedby="type-name-error"><div class="field-error" id="type-name-error" hidden>请输入展示名称。</div></div>' +
          '<div class="form-item full">' + fieldLabel("type-description", "说明", "保存只更新本页原型，刷新后恢复；生产场景应同步集市展示并记录审计，本原型不执行真实同步或审计写入。") + '<textarea class="textarea" id="type-description" aria-describedby="help-type-description">' + escapeHtml(type.description) + '</textarea></div>' +
          '</div>';
        openDrawer("编辑“" + type.name + "”展示信息", body,
          '<button class="btn" type="button" data-close-drawer>取消</button><button class="btn btn-primary" type="button" data-save-type="' + type.id + '">保存</button>');
      }

      function saveType(id) {
        var type = getType(id);
        var nameInput = document.getElementById("type-name");
        var error = document.getElementById("type-name-error");
        if (!nameInput.value.trim()) {
          nameInput.setAttribute("aria-invalid", "true");
          error.hidden = false;
          return;
        }
        type.name = nameInput.value.trim();
        type.description = document.getElementById("type-description").value.trim() || "—";
        type.order = Number(document.getElementById("type-order").value) || type.order;
        closeDrawer();
        render();
        showToast("展示信息已更新（原型演示，未同步集市或写入审计）");
      }

      function toggleType(id) {
        var type = getType(id);
        if (!type.shown) {
          type.shown = true;
          render();
          showToast(type.name + "已恢复呈现（原型演示，未同步集市）");
          return;
        }
        var body = '<p class="modal-copy">停用后，服务集市将隐藏“' + escapeHtml(type.name) + '”类型及其新发现入口。</p>' +
          '<div class="impact-box"><div class="policy-label">受影响的集市产品</div><div class="impact-number numeric">' + type.count + ' 个</div><div class="policy-note">既有产品、授权和调用继续有效；创建与注册不受影响。</div></div>' +
          '<div class="inline-alert warning" style="margin-top:16px">该动作只改变对外呈现，不代替单个产品的下线。</div>';
        openModal("停用“" + type.name + "”对外呈现", body, "确认停用呈现", function () {
          type.shown = false;
          closeModal();
          render();
          showToast(type.name + "已停止对外呈现（原型演示，未写入审计）");
        }, true);
      }

      function hideHelp() {
        window.clearTimeout(tooltipTimer);
        if (activeTooltip) activeTooltip.hidden = true;
        activeTooltip = null;
        tooltipTrigger = null;
      }

      function showHelp(trigger) {
        window.clearTimeout(tooltipTimer);
        var tooltip = document.getElementById(trigger.dataset.help);
        if (!tooltip) return;
        if (activeTooltip && activeTooltip !== tooltip) hideHelp();
        activeTooltip = tooltip;
        tooltipTrigger = trigger;
        tooltip.hidden = false;
        var rect = trigger.getBoundingClientRect();
        var size = tooltip.getBoundingClientRect();
        var left = Math.max(16, Math.min(rect.left, window.innerWidth - size.width - 16));
        var top = rect.bottom + 8;
        if (top + size.height > window.innerHeight - 16) top = rect.top - size.height - 8;
        tooltip.style.left = left + "px";
        tooltip.style.top = Math.max(16, top) + "px";
      }

      function selectedAuthMethods() {
        return Array.prototype.slice.call(document.querySelectorAll("[data-auth-method]:checked")).map(function (input) { return input.value; });
      }

      function syncAuthAvailability(showDefaultError) {
        hideHelp();
        var selected = selectedAuthMethods();
        authDefinitions.forEach(function (definition, index) {
          var enabled = document.getElementById("auth-method-" + index).checked;
          var fields = document.getElementById("auth-fields-" + definition.id);
          fields.hidden = !enabled;
          fields.disabled = !enabled;
          document.getElementById("auth-status-" + definition.id).textContent = enabled ? "已启用" : "未启用";
          definition.fields.forEach(function (field) {
            var input = document.getElementById(field.id);
            input.disabled = !enabled;
            if (!enabled) {
              input.removeAttribute("aria-invalid");
              document.getElementById("error-" + field.id).hidden = true;
            }
          });
        });
        var select = document.getElementById("default-method");
        var current = selected.indexOf(select.value) !== -1 ? select.value : "";
        select.innerHTML = (current ? "" : '<option value="">请选择默认认证方式</option>') + selected.map(function (method) {
          return '<option value="' + escapeHtml(method) + '">' + escapeHtml(method) + '</option>';
        }).join("");
        select.value = current;
        select.disabled = !selected.length;
        document.getElementById("default-method-error").hidden = !!current || !showDefaultError;
        if (!current && showDefaultError) select.setAttribute("aria-invalid", "true");
        else select.removeAttribute("aria-invalid");
        document.getElementById("auth-method-error").hidden = true;
        document.getElementById("common-policy-error").hidden = true;
      }

      function hasUnsavedSettings() {
        if (state.variantBTopic === "auth") {
          var method = document.getElementById("default-method");
          if (!method) return false;
          return selectedAuthMethods().join("|") !== state.common.allowed.join("|") ||
            method.value !== state.common.defaultMethod || authDefinitions.some(function (definition, index) {
              return document.getElementById("auth-method-" + index).checked && definition.fields.some(function (field) {
                return document.getElementById(field.id).value !== String(state.common[field.key]);
              });
            });
        }
        if (drawerLimitId && drawerLayer.classList.contains("open")) {
          return getLimit(drawerLimitId).fields.some(function (field) {
            var input = document.getElementById("limit-" + field.key);
            return input && input.value !== String(field.value);
          });
        }
        return false;
      }

      function requestSettingsView(topic, afterSwitch) {
        if (topic === state.variantBTopic && !afterSwitch) return;
        function applyView() {
          closeDrawer();
          state.variantBTopic = topic;
          render();
          if (afterSwitch) afterSwitch();
        }
        if (hasUnsavedSettings()) {
          openModal("放弃未保存的更改？", '<p class="modal-copy">当前配置尚未保存。切换后将恢复已保存的示例值。</p>', "放弃并切换", function () {
            closeModal();
            applyView();
          }, true);
        } else {
          applyView();
        }
      }

      function editCommon() {
        requestSettingsView("auth");
      }

      function revealError(error) {
        error.hidden = false;
        error.scrollIntoView({block: "nearest", inline: "nearest"});
      }

      function saveCommon() {
        var selected = selectedAuthMethods();
        var methodError = document.getElementById("auth-method-error");
        var policyError = document.getElementById("common-policy-error");
        var defaultError = document.getElementById("default-method-error");
        var methodInput = document.getElementById("default-method");
        var proposed = Object.assign({}, state.common, {allowed: selected, defaultMethod: methodInput.value});
        var invalid = [];
        methodError.hidden = true;
        policyError.hidden = true;
        defaultError.hidden = true;
        methodInput.removeAttribute("aria-invalid");
        authDefinitions.forEach(function (definition) {
          definition.fields.forEach(function (field) {
            document.getElementById(field.id).removeAttribute("aria-invalid");
            document.getElementById("error-" + field.id).hidden = true;
          });
        });
        if (!selected.length) {
          revealError(methodError);
          return;
        }
        if (selected.indexOf(proposed.defaultMethod) === -1) {
          methodInput.setAttribute("aria-invalid", "true");
          defaultError.hidden = false;
          policyError.textContent = "请选择一种已启用的默认认证方式。";
          revealError(policyError);
          return;
        }
        function markInvalid(field, message) {
          document.getElementById(field.id).setAttribute("aria-invalid", "true");
          var error = document.getElementById("error-" + field.id);
          error.textContent = message;
          error.hidden = false;
          invalid.push(message);
        }
        authDefinitions.forEach(function (definition) {
          if (selected.indexOf(definition.name) === -1) return;
          definition.fields.forEach(function (field) {
            var input = document.getElementById(field.id);
            var value = Number(input.value);
            proposed[field.key] = value;
            if (!input.value.trim() || !Number.isSafeInteger(value) || value < 1 || value > (field.max || Number.MAX_SAFE_INTEGER)) {
              markInvalid(field, "请输入" + (field.max ? " 1–" + field.max + " 范围内的" : "有效的") + "正整数。");
            }
          });
          definition.fields.forEach(function (field) {
            if (field.upper && proposed[field.key] > proposed[field.upper]) markInvalid(field, "默认有效期不能超过该凭据的最长有效期。");
          });
        });
        if (invalid.length) {
          policyError.textContent = "配置尚未保存，请修正已启用认证方式中的标红字段。";
          revealError(policyError);
          return;
        }
        var affected = [];
        state.runningAuth.forEach(function (application) {
          if (selected.indexOf(application.method) === -1) {
            affected.push(application.name + "（正在使用 " + application.method + "）");
            return;
          }
          var definition = authDefinitions.find(function (item) { return item.name === application.method; });
          Object.keys(application.limits || {}).forEach(function (key) {
            if (proposed[key] < application.limits[key]) {
              var field = definition.fields.find(function (item) { return item.key === key; });
              affected.push(application.name + "（" + field.label + "配置为 " + application.limits[key] + " " + field.unit + "）");
              markInvalid(field, "低于运行应用的配置 " + application.limits[key] + " " + field.unit + "，请先调整应用版本。");
            }
          });
        });
        if (affected.length) {
          policyError.textContent = "无法保存，将影响运行应用：" + affected.join("、") + "。请先通过数据应用新版本完成调整。";
          revealError(policyError);
          return;
        }
        var changes = [
          ["允许认证方式", state.common.allowed.join("、"), selected.join("、")],
          ["默认认证方式", state.common.defaultMethod, proposed.defaultMethod]
        ];
        authDefinitions.forEach(function (definition) {
          if (selected.indexOf(definition.name) === -1) return;
          definition.fields.forEach(function (field) {
            changes.push([definition.name + " · " + field.label, state.common[field.key] + " " + field.unit, proposed[field.key] + " " + field.unit]);
          });
        });
        changes = changes.filter(function (change) { return change[1] !== change[2]; });
        var preview = changes.length ? '<ul class="limit-preview">' + changes.map(function (change) {
          return '<li>' + escapeHtml(change[0]) + '：' + escapeHtml(change[1]) + ' → ' + escapeHtml(change[2]) + '</li>';
        }).join("") + '</ul>' : '<p class="limit-note">本次未改变配置值。</p>';
        openModal("确认认证与凭据策略", '<p class="modal-copy">已检查运行应用的凭据配置示例，未发现受影响对象。</p>' + preview +
          '<p class="limit-note">仅保存本页原型状态。不会签发、轮换或延长已有令牌、密钥及证书，不下发认证配置；刷新后恢复。</p>', "确认保存", function () {
            state.common = proposed;
            closeModal();
            render();
            showToast("认证与凭据策略已保存（原型演示，未下发配置）");
          });
      }

      function editLimit(id) {
        var limit = getLimit(id);
        if (!limit) return;
        requestSettingsView("limits", function () {
          drawerLimitId = id;
          openDrawer("编辑“" + getType(id).name + "”专属限制", limitPolicyForm(limit),
            '<span class="settings-footer-copy">原型示例' + helpControl("help-drawer-save", "保存范围", "只保存当前页面的示例值，刷新恢复；不下发网关或运行时。保存前校验运行应用配置，收紧不能影响现有调用。") + '</span>' +
            '<button class="btn" type="button" data-close-drawer>取消</button><button class="btn btn-primary" type="button" data-save-limit="' + id + '">保存</button>');
        });
      }

      function saveLimit(id) {
        var type = getType(id);
        var limit = getLimit(id);
        if (!limit) return;
        var error = document.getElementById("limit-error");
        var proposed = {};
        var invalid = [];
        var affected = [];
        error.hidden = true;
        limit.fields.forEach(function (field) {
          var input = document.getElementById("limit-" + field.key);
          var value = Number(input.value);
          input.removeAttribute("aria-invalid");
          proposed[field.key] = value;
          if (!input.value.trim() || !Number.isSafeInteger(value) || value < 1) {
            invalid.push(field.label + "必须为有效的正整数");
            input.setAttribute("aria-invalid", "true");
          } else if (value < field.used) {
            affected.push(field.label + "低于“" + limit.application + "”等运行应用的配置 " + formatLimit(field.used) + " " + field.unit);
            input.setAttribute("aria-invalid", "true");
          }
        });
        if (invalid.length || affected.length) {
          error.innerHTML = invalid.length ? escapeHtml(invalid.join("；")) + '。' :
            '<strong>无法保存，可能影响消费方使用。</strong><br>' + escapeHtml(affected.join("；")) + '。请先通过数据应用新版本完成调整。';
          revealError(error);
          return;
        }
        var changes = limit.fields.filter(function (field) { return field.value !== proposed[field.key]; });
        var preview = changes.length ? '<ul class="limit-preview">' + changes.map(function (field) {
          return '<li>' + escapeHtml(field.label) + '：' + formatLimit(field.value) + ' → ' + formatLimit(proposed[field.key]) + ' ' + escapeHtml(field.unit) + '</li>';
        }).join("") + '</ul>' : '<p class="limit-note">本次未改变限制值。</p>';
        openModal("确认“" + type.name + "”专属限制", '<p class="modal-copy">已按 ' + limit.apps + ' 个运行数据应用的最高配置摘要完成示例校验，未发现超限对象。</p>' + preview +
          '<p class="limit-note">仅保存本页原型状态，不修改运行应用、不下发网关或运行时配置；刷新后恢复示例值。</p>', "确认保存", function () {
          limit.fields.forEach(function (field) { field.value = proposed[field.key]; });
          closeModal();
          closeDrawer();
          render();
          showToast(type.name + "专属限制已保存（原型演示，未下发配置）");
        });
      }

      document.addEventListener("click", function (event) {
        if (event.target.hasAttribute && event.target.hasAttribute("data-close-drawer")) {
          requestDrawerClose();
          return;
        }
        var target = event.target.closest("button");
        if (!target) return;
        if (target.dataset.toast) showToast(target.dataset.toast);
        if (target.dataset.topic) requestSettingsView(target.dataset.topic);
        if (target.hasAttribute("data-reset-settings")) { render(); showToast("未保存的更改已取消"); }
        if (target.dataset.help) showHelp(target);
        if (target.dataset.editType) editType(target.dataset.editType);
        if (target.dataset.toggleType) toggleType(target.dataset.toggleType);
        if (target.hasAttribute("data-edit-common")) editCommon();
        if (target.dataset.editLimit) editLimit(target.dataset.editLimit);
        if (target.dataset.saveType) saveType(target.dataset.saveType);
        if (target.hasAttribute("data-save-common")) saveCommon();
        if (target.dataset.saveLimit) saveLimit(target.dataset.saveLimit);
        if (target.hasAttribute("data-close-drawer")) requestDrawerClose();
        if (target.hasAttribute("data-close-modal")) closeModal();
      });

      document.addEventListener("change", function (event) {
        if (event.target.dataset.authMethod) syncAuthAvailability(true);
        if (event.target.id === "default-method") {
          document.getElementById("default-method-error").hidden = !!event.target.value;
          if (event.target.value) event.target.removeAttribute("aria-invalid");
        }
      });

      modalConfirm.addEventListener("click", function () {
        if (typeof modalAction === "function") modalAction();
      });

      document.addEventListener("mouseover", function (event) {
        var trigger = event.target.closest("[data-help]");
        if (trigger) showHelp(trigger);
        else if (activeTooltip && activeTooltip.contains(event.target)) window.clearTimeout(tooltipTimer);
      });
      document.addEventListener("mouseout", function (event) {
        if (!activeTooltip) return;
        var next = event.relatedTarget;
        if (next && (activeTooltip.contains(next) || tooltipTrigger.contains(next))) return;
        window.clearTimeout(tooltipTimer);
        tooltipTimer = window.setTimeout(function () {
          if (document.activeElement !== tooltipTrigger) hideHelp();
        }, 120);
      });
      document.addEventListener("focusin", function (event) {
        var trigger = event.target.closest("[data-help]");
        if (trigger) showHelp(trigger);
      });
      document.addEventListener("focusout", function (event) {
        if (event.target === tooltipTrigger) hideHelp();
      });
      document.addEventListener("scroll", hideHelp, true);

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          if (activeTooltip) hideHelp();
          else if (modalLayer.classList.contains("open")) closeModal();
          else if (drawerLayer.classList.contains("open")) requestDrawerClose();
        }
      });

      var pageUrl = new URL(window.location.href);
      if (pageUrl.searchParams.has("variant")) {
        pageUrl.searchParams.delete("variant");
        window.history.replaceState({}, "", pageUrl);
      }
      render();
    }());
  </script>
</body>
</html>
