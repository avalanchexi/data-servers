<!-- SELECTED PROTOTYPE — Variant C is the product-facing default. Historical A/B/C comparison is available only with ?compare=1&variant=A|B|C. -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据服务平台 · AI 服务开发原型</title>
  <style>
    :root {
      --ds-color-white: #ffffff;
      --ds-color-black: #000000;
      --ds-color-primary-1: #e8f3ff;
      --ds-color-primary-2: #bedaff;
      --ds-color-primary-3: #94bfff;
      --ds-color-primary-4: #6aa1ff;
      --ds-color-primary-5: #4080ff;
      --ds-color-primary-6: #165dff;
      --ds-color-primary-7: #0e42d2;
      --ds-color-primary-8: #072ca6;
      --ds-color-gray-1: #f7f8fa;
      --ds-color-gray-2: #f2f3f5;
      --ds-color-gray-3: #e5e6eb;
      --ds-color-gray-4: #c9cdd4;
      --ds-color-gray-5: #a9aeb8;
      --ds-color-gray-6: #86909c;
      --ds-color-gray-7: #6b7785;
      --ds-color-gray-8: #4e5969;
      --ds-color-gray-9: #272e3b;
      --ds-color-gray-10: #1d2129;
      --ds-color-success: #00b42a;
      --ds-color-success-light: #e8ffea;
      --ds-color-success-text: #087a24;
      --ds-color-warning: #ff7d00;
      --ds-color-warning-light: #fff7e8;
      --ds-color-warning-text: #a84b00;
      --ds-color-danger: #f53f3f;
      --ds-color-danger-light: #ffece8;
      --ds-color-danger-text: #cb2634;
      --ds-bg-canvas: var(--ds-color-gray-2);
      --ds-bg-surface: var(--ds-color-white);
      --ds-bg-elevated: var(--ds-color-white);
      --ds-bg-fill: var(--ds-color-gray-2);
      --ds-bg-fill-hover: var(--ds-color-gray-3);
      --ds-text-1: var(--ds-color-gray-10);
      --ds-text-2: var(--ds-color-gray-8);
      --ds-text-3: var(--ds-color-gray-6);
      --ds-text-4: var(--ds-color-gray-4);
      --ds-border-1: var(--ds-color-gray-2);
      --ds-border-2: var(--ds-color-gray-3);
      --ds-border-3: var(--ds-color-gray-4);
      --ds-focus-ring: 0 0 0 2px rgb(22 93 255 / 18%);
      --ds-mask: rgb(29 33 41 / 60%);
      --ds-font-sans: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      --ds-font-mono: Consolas, Menlo, Monaco, monospace;
      --ds-font-size-12: 12px;
      --ds-font-size-14: 14px;
      --ds-font-size-16: 16px;
      --ds-font-size-20: 20px;
      --ds-font-size-24: 24px;
      --ds-font-size-36: 36px;
      --ds-font-weight-regular: 400;
      --ds-font-weight-medium: 500;
      --ds-font-weight-semibold: 600;
      --ds-line-height-base: 1.5715;
      --ds-line-height-tight: 1.35;
      --ds-space-0: 0;
      --ds-space-1: 2px;
      --ds-space-2: 4px;
      --ds-space-3: 6px;
      --ds-space-4: 8px;
      --ds-space-5: 10px;
      --ds-space-6: 12px;
      --ds-space-7: 16px;
      --ds-space-8: 20px;
      --ds-space-9: 24px;
      --ds-space-10: 32px;
      --ds-space-11: 36px;
      --ds-space-12: 40px;
      --ds-space-13: 48px;
      --ds-space-16: 64px;
      --ds-radius-none: 0;
      --ds-radius-small: 2px;
      --ds-radius-medium: 4px;
      --ds-radius-large: 8px;
      --ds-radius-circle: 50%;
      --ds-shadow-none: none;
      --ds-shadow-1: 0 2px 5px rgb(0 0 0 / 10%);
      --ds-shadow-2: 0 4px 10px rgb(0 0 0 / 10%);
      --ds-shadow-3: 0 8px 20px rgb(0 0 0 / 10%);
      --ds-duration-fast: 100ms;
      --ds-duration-base: 200ms;
      --ds-duration-slow: 300ms;
      --ds-ease-standard: cubic-bezier(0.34, 0.69, 0.1, 1);
      --ds-control-mini: 24px;
      --ds-control-small: 28px;
      --ds-control-default: 32px;
      --ds-control-large: 36px;
      --ds-nav-height: 60px;
      --ds-sidebar-width: 220px;
      --ds-desktop-min: 1200px;
      --ds-content-max: 1440px;
      --ds-grid-gutter: 16px;
      --ds-page-padding: 24px;
      --ds-z-popup: 1000;
      --ds-z-modal: 1001;
      --ds-z-message: 1003;
      --ds-button-height: var(--ds-control-default);
      --ds-button-radius: var(--ds-radius-small);
      --ds-button-padding-inline: 15px;
      --ds-input-height: var(--ds-control-default);
      --ds-input-radius: var(--ds-radius-small);
      --ds-form-item-gap: 20px;
      --ds-table-cell-padding-inline: 16px;
      --ds-table-cell-padding-block: 9px;
      --ds-pagination-item-size: 32px;
      --ds-modal-width: 520px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-width: var(--ds-desktop-min);
      overflow: hidden;
      color: var(--ds-text-1);
      background: var(--ds-bg-canvas);
      font-family: var(--ds-font-sans);
      font-size: var(--ds-font-size-14);
      line-height: var(--ds-line-height-base);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button, input, select, textarea, a { outline: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      box-shadow: var(--ds-focus-ring);
    }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .icon { width: 16px; height: 16px; flex: 0 0 auto; }
    .icon-sm { width: 14px; height: 14px; }

    .topbar {
      position: fixed; z-index: 30; inset: 0 0 auto 0; height: var(--ds-nav-height);
      display: flex; align-items: center; border-bottom: 1px solid var(--ds-border-2);
      background: var(--ds-bg-surface);
    }
    .product-area {
      width: var(--ds-sidebar-width); height: 100%; display: flex; align-items: center;
      gap: var(--ds-space-6); padding: 0 var(--ds-space-8); border-right: 1px solid var(--ds-border-2);
      font-size: var(--ds-font-size-16); font-weight: var(--ds-font-weight-semibold);
    }
    .product-symbol {
      width: var(--ds-control-default); height: var(--ds-control-default); display: grid;
      place-items: center; border-radius: var(--ds-radius-medium); color: var(--ds-color-white);
      background: var(--ds-color-primary-6);
    }
    .top-domain {
      height: 100%; display: flex; align-items: center; padding: 0 var(--ds-space-9);
      border-bottom: 2px solid var(--ds-color-primary-6); color: var(--ds-color-primary-6);
      font-weight: var(--ds-font-weight-medium);
    }
    .top-spacer { flex: 1; }
    .top-actions { display: flex; align-items: center; gap: var(--ds-space-4); padding-right: var(--ds-space-8); }
    .top-icon, .user-chip {
      min-height: var(--ds-control-large); display: inline-flex; align-items: center; justify-content: center;
      gap: var(--ds-space-4); border: 0; border-radius: var(--ds-radius-medium);
      color: var(--ds-text-2); background: transparent;
    }
    .top-icon { width: var(--ds-control-large); }
    .user-chip { padding: 0 var(--ds-space-5); }
    .top-icon:hover, .user-chip:hover { background: var(--ds-bg-fill); }
    .avatar {
      width: var(--ds-control-small); height: var(--ds-control-small); display: grid; place-items: center;
      border-radius: var(--ds-radius-circle); color: var(--ds-color-primary-7);
      background: var(--ds-color-primary-1); font-size: var(--ds-font-size-12); font-weight: var(--ds-font-weight-medium);
    }

    .sidebar {
      position: fixed; z-index: 20; top: var(--ds-nav-height); bottom: 0; left: 0;
      width: var(--ds-sidebar-width); overflow-y: auto; border-right: 1px solid var(--ds-border-2);
      background: var(--ds-bg-surface); padding: var(--ds-space-6) var(--ds-space-4);
    }
    .nav-item, .nav-child {
      width: 100%; min-height: var(--ds-control-large); display: flex; align-items: center;
      gap: var(--ds-space-6); border: 0; border-radius: var(--ds-radius-small);
      color: var(--ds-text-2); background: transparent; text-align: left;
      transition: background var(--ds-duration-fast) var(--ds-ease-standard), color var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .nav-item { padding: 0 var(--ds-space-6); }
    .nav-child { position: relative; min-height: var(--ds-control-default); padding: 0 var(--ds-space-6) 0 var(--ds-space-8); font-size: var(--ds-font-size-14); }
    .nav-item:hover, .nav-child:hover { color: var(--ds-text-1); background: var(--ds-bg-fill); }
    .nav-item.active, .nav-child.active {
      color: var(--ds-color-primary-7); background: var(--ds-color-primary-1);
      font-weight: var(--ds-font-weight-medium);
    }
    .nav-child.active::before {
      content: ""; position: absolute; left: var(--ds-space-3); width: 3px; height: 16px;
      border-radius: var(--ds-radius-small); background: var(--ds-color-primary-6);
    }
    .nav-group { margin: var(--ds-space-2) 0; }
    .nav-children { padding: var(--ds-space-3) 0 var(--ds-space-3) var(--ds-space-8); }
    .nav-divider { height: 1px; margin: var(--ds-space-6); background: var(--ds-border-1); }

    .workspace {
      position: fixed; top: var(--ds-nav-height); right: 0; bottom: 0; left: var(--ds-sidebar-width);
      overflow: auto; background: var(--ds-bg-canvas);
    }
    .view { min-height: 100%; }
    .page-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: var(--ds-space-9); padding: var(--ds-space-7) var(--ds-page-padding);
      border-bottom: 1px solid var(--ds-border-2); background: var(--ds-bg-surface);
    }
    .page-title-row { display: flex; align-items: center; gap: var(--ds-space-6); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: var(--ds-font-size-24); line-height: var(--ds-line-height-tight); font-weight: var(--ds-font-weight-medium); }
    h2 { margin-bottom: var(--ds-space-4); font-size: var(--ds-font-size-16); font-weight: var(--ds-font-weight-medium); }
    h3 { margin-bottom: var(--ds-space-3); font-size: var(--ds-font-size-14); font-weight: var(--ds-font-weight-medium); }
    .page-description, .muted { color: var(--ds-text-3); }
    .page-description { margin: var(--ds-space-3) 0 0; }
    .breadcrumb { display: flex; align-items: center; gap: var(--ds-space-4); margin-bottom: var(--ds-space-3); color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .page-actions, .inline-actions { display: flex; align-items: center; gap: var(--ds-space-5); }
    .page-body { width: 100%; max-width: var(--ds-content-max); margin: 0 auto; padding: var(--ds-page-padding); }

    .btn {
      min-height: var(--ds-button-height); display: inline-flex; align-items: center; justify-content: center;
      gap: var(--ds-space-4); padding: 0 var(--ds-button-padding-inline); border: 1px solid var(--ds-border-3);
      border-radius: var(--ds-button-radius); color: var(--ds-text-1); background: var(--ds-bg-surface);
    }
    .btn:hover { border-color: var(--ds-color-primary-5); color: var(--ds-color-primary-6); }
    .btn-primary { border-color: var(--ds-color-primary-6); color: var(--ds-color-white); background: var(--ds-color-primary-6); }
    .btn-primary:hover { border-color: var(--ds-color-primary-7); color: var(--ds-color-white); background: var(--ds-color-primary-7); }
    .btn-danger { border-color: var(--ds-color-danger); color: var(--ds-color-danger-text); background: var(--ds-bg-surface); }
    .btn-danger:hover { color: var(--ds-color-white); background: var(--ds-color-danger); }
    .btn-text { min-height: var(--ds-control-small); padding: 0 var(--ds-space-3); border-color: transparent; color: var(--ds-color-primary-6); background: transparent; }
    .btn-text:hover { background: var(--ds-color-primary-1); }
    .btn-small { min-height: var(--ds-control-small); padding: 0 var(--ds-space-5); font-size: var(--ds-font-size-12); }
    .icon-btn {
      width: var(--ds-control-default); height: var(--ds-control-default); display: grid; place-items: center;
      padding: 0; border: 1px solid var(--ds-border-3); border-radius: var(--ds-radius-small);
      color: var(--ds-text-2); background: var(--ds-bg-surface);
    }

    .panel {
      border: 1px solid var(--ds-border-2); border-radius: var(--ds-radius-medium);
      background: var(--ds-bg-surface);
    }
    .panel-head {
      min-height: 52px; display: flex; align-items: center; justify-content: space-between;
      gap: var(--ds-space-7); padding: var(--ds-space-6) var(--ds-space-7);
      border-bottom: 1px solid var(--ds-border-2);
    }
    .panel-title { margin: 0; }
    .panel-body { padding: var(--ds-space-7); }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--ds-grid-gutter); margin-bottom: var(--ds-space-7); }
    .summary-card { min-height: 112px; padding: var(--ds-space-7); border: 1px solid var(--ds-border-2); border-radius: var(--ds-radius-medium); background: var(--ds-bg-surface); }
    .summary-label { color: var(--ds-text-2); }
    .summary-value { margin-top: var(--ds-space-5); font-size: var(--ds-font-size-24); line-height: var(--ds-line-height-tight); font-weight: var(--ds-font-weight-medium); }
    .summary-note { margin-top: var(--ds-space-4); color: var(--ds-text-3); font-size: var(--ds-font-size-12); }

    .filter-bar {
      display: flex; align-items: center; gap: var(--ds-space-6); padding: var(--ds-space-6) var(--ds-space-7);
      border-bottom: 1px solid var(--ds-border-2);
    }
    .filter-spacer { flex: 1; }
    .input, .select, .textarea {
      width: 100%; border: 1px solid var(--ds-border-3); border-radius: var(--ds-input-radius);
      color: var(--ds-text-1); background: var(--ds-bg-surface);
    }
    .input, .select { height: var(--ds-input-height); padding: 0 var(--ds-space-6); }
    .textarea { min-height: 92px; padding: var(--ds-space-6); resize: vertical; }
    .input:hover, .select:hover, .textarea:hover { border-color: var(--ds-color-primary-4); }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--ds-color-primary-6); }
    .search-wrap { position: relative; width: 280px; }
    .search-wrap .input { padding-left: 34px; }
    .search-wrap .icon { position: absolute; top: 8px; left: 10px; color: var(--ds-text-3); }
    .filter-select { width: 150px; }

    .table-scroll { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    caption { text-align: left; }
    th, td {
      padding: var(--ds-table-cell-padding-block) var(--ds-table-cell-padding-inline);
      border-bottom: 1px solid var(--ds-border-2); text-align: left; vertical-align: middle;
      white-space: nowrap;
    }
    th { color: var(--ds-text-2); background: var(--ds-color-gray-1); font-weight: var(--ds-font-weight-medium); }
    tbody tr:hover { background: var(--ds-color-gray-1); }
    tbody tr:last-child td { border-bottom: 0; }
    .service-cell { display: flex; align-items: center; gap: var(--ds-space-6); min-width: 220px; }
    .type-mark {
      width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--ds-radius-medium);
      color: var(--ds-color-primary-7); background: var(--ds-color-primary-1); font-size: var(--ds-font-size-12);
      font-weight: var(--ds-font-weight-semibold);
    }
    .cell-primary { color: var(--ds-text-1); font-weight: var(--ds-font-weight-medium); }
    .cell-secondary { color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .status {
      display: inline-flex; align-items: center; gap: var(--ds-space-3); min-height: 22px;
      padding: 0 var(--ds-space-5); border-radius: var(--ds-radius-small); font-size: var(--ds-font-size-12);
      font-weight: var(--ds-font-weight-medium);
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: var(--ds-radius-circle); background: currentColor; }
    .status-success { color: var(--ds-color-success-text); background: var(--ds-color-success-light); }
    .status-warning { color: var(--ds-color-warning-text); background: var(--ds-color-warning-light); }
    .status-danger { color: var(--ds-color-danger-text); background: var(--ds-color-danger-light); }
    .status-neutral { color: var(--ds-text-2); background: var(--ds-bg-fill); }
    .tag {
      display: inline-flex; align-items: center; min-height: 22px; padding: 0 var(--ds-space-5);
      border: 1px solid var(--ds-border-2); border-radius: var(--ds-radius-small);
      color: var(--ds-text-2); background: var(--ds-bg-surface); font-size: var(--ds-font-size-12);
    }
    .tag-primary { border-color: var(--ds-color-primary-2); color: var(--ds-color-primary-7); background: var(--ds-color-primary-1); }
    .pagination {
      display: flex; align-items: center; justify-content: space-between; padding: var(--ds-space-6) var(--ds-space-7);
      border-top: 1px solid var(--ds-border-2); color: var(--ds-text-3); font-size: var(--ds-font-size-12);
    }

    .alert {
      display: flex; align-items: flex-start; gap: var(--ds-space-6); margin-bottom: var(--ds-space-7);
      padding: var(--ds-space-6) var(--ds-space-7); border: 1px solid var(--ds-color-primary-2);
      border-radius: var(--ds-radius-medium); color: var(--ds-color-primary-8); background: var(--ds-color-primary-1);
    }
    .alert-warning { border-color: var(--ds-color-warning); color: var(--ds-color-warning-text); background: var(--ds-color-warning-light); }
    .alert-success { border-color: var(--ds-color-success); color: var(--ds-color-success-text); background: var(--ds-color-success-light); }
    .alert-body { flex: 1; }
    .alert-title { margin-bottom: var(--ds-space-2); font-weight: var(--ds-font-weight-medium); }
    .alert-copy { margin: 0; color: inherit; font-size: var(--ds-font-size-12); }

    .workbench-page { height: calc(100vh - var(--ds-nav-height)); display: flex; flex-direction: column; overflow: hidden; }
    .workbench-head { flex: 0 0 auto; }
    .workbench { min-height: 0; flex: 1; display: grid; background: var(--ds-bg-canvas); }
    .manual-workbench { grid-template-columns: 240px minmax(0, 1fr); }
    .workbench-nav, .assistant-panel { overflow-y: auto; background: var(--ds-bg-surface); }
    .workbench-nav { border-right: 1px solid var(--ds-border-2); padding: var(--ds-space-6); }
    .workbench-nav h2 { padding: var(--ds-space-4) var(--ds-space-6); color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .section-button {
      width: 100%; min-height: var(--ds-control-large); display: flex; align-items: center; gap: var(--ds-space-5);
      padding: 0 var(--ds-space-6); border: 0; border-radius: var(--ds-radius-small);
      color: var(--ds-text-2); background: transparent; text-align: left;
    }
    .section-button:hover { background: var(--ds-bg-fill); }
    .section-button.active { color: var(--ds-color-primary-7); background: var(--ds-color-primary-1); font-weight: var(--ds-font-weight-medium); }
    .workbench-main { min-width: 0; overflow-y: auto; padding: var(--ds-space-7); }
    .editor-panel { min-height: 100%; }
    .editor-tabs { display: flex; gap: var(--ds-space-8); border-bottom: 1px solid var(--ds-border-2); padding: 0 var(--ds-space-7); }
    .tab-button {
      min-height: 44px; padding: 0 var(--ds-space-2); border: 0; border-bottom: 2px solid transparent;
      color: var(--ds-text-2); background: transparent;
    }
    .tab-button.active { border-bottom-color: var(--ds-color-primary-6); color: var(--ds-color-primary-6); font-weight: var(--ds-font-weight-medium); }
    .editor-body { padding: var(--ds-space-7); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ds-form-item-gap) var(--ds-space-7); }
    .form-item { min-width: 0; }
    .form-item.full { grid-column: 1 / -1; }
    .form-item label, .field-label { display: block; margin-bottom: var(--ds-space-4); color: var(--ds-text-2); font-weight: var(--ds-font-weight-medium); }
    .help { margin-top: var(--ds-space-3); color: var(--ds-text-3); font-size: var(--ds-font-size-12); }
    .prompt-editor {
      min-height: 210px; font-family: var(--ds-font-mono); line-height: 1.65; white-space: pre-wrap;
    }
    .dependency-list { display: grid; gap: var(--ds-space-6); }
    .dependency-item {
      display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-7);
      padding: var(--ds-space-6); border: 1px solid var(--ds-border-2); border-radius: var(--ds-radius-medium);
    }
    .assistant-panel { border-left: 1px solid var(--ds-border-2); display: flex; flex-direction: column; }
    .assistant-head { flex: 0 0 auto; padding: var(--ds-space-7); border-bottom: 1px solid var(--ds-border-2); }
    .assistant-title { display: flex; align-items: center; gap: var(--ds-space-5); margin-bottom: var(--ds-space-3); }

      function switchVariant(step) {
        if (!compareMode) return;

        modalLayer.classList.add("open");

      function deleteService(id) {
        var service = serviceRows.find(function (item) { return item.id === id; });

          service = serviceRows.find(function (item) { return item.id === id; });
          if (!deletable(service)) { closeModal(); showToast("服务状态已变化，不能删除"); return; }
          service.deleted = true;
          service.history.push({ action: "删除服务", note: "从服务目录移除，历史记录保留", revision: service.revision });

      function showSkillPathError(message) {

      function renameSkillFile() {
        if (!canEditSkill() || state.skillFile === "SKILL.md") return;

      function deleteSkillEntry(path, folder) {

          '</div></div><div class="form-item"><label for="new-service-name">服务名称（必填）</label><input class="input" id="new-service-name" placeholder="请输入服务名称" required aria-describedby="new-service-error"><div class="field-error" id="new-service-error" hidden>请输入服务名称。</div></div>' +
          '<div class="form-item"><label for="new-service-desc">服务说明（必填）</label><textarea class="textarea" id="new-service-desc" placeholder="请输入服务说明" required aria-describedby="new-service-desc-error"></textarea><div class="field-error" id="new-service-desc-error" hidden>请输入服务说明。</div></div>' +
          '<div class="form-item"><span class="field-label" id="hosting-label">AI 服务是否托管' + help("是：在平台开发并托管服务，同时配置数据需求。否：仅登记和配置数据需求，不在平台开发、测试或部署。") + '</span><div class="radio-row" role="group" aria-labelledby="hosting-label"><label><input type="radio" name="hosting" id="new-hosted-yes" value="yes" checked> 是</label><label><input type="radio" name="hosting" id="new-hosted-no" value="no"> 否</label></div><p class="help" id="hosting-summary" role="status">平台托管 · 数据需求 + 类型专属开发配置</p></div>' +
          '<div class="form-item" id="creation-mode-field"><span class="field-label">开发方式' + help("创建后可在服务配置中切换；两种方式共用同一个草稿、修订和审核流程。") + '</span><div class="creation-mode-options"><label class="creation-mode-option"><input type="radio" name="creation-mode" id="creation-mode-ai" value="ai" checked><span><strong>AI 对话创建</strong><span>以开发 Agent 会话为主；右侧配置只读，采纳变更后写入草稿。</span></span></label><label class="creation-mode-option"><input type="radio" name="creation-mode" id="creation-mode-manual" value="manual"><span><strong>手工创建</strong><span>进入类型专属编辑器，配置、保存与校验均由开发者执行。</span></span></label></div><p class="help">测试、提交审核、审批与上线始终需要人工执行。</p></div>', "创建草稿", function () {

      function assetResults() {

        }).join('') : '<div class="editor-empty">未找到匹配的数据资产</div>';
      }
      function selectAssets() {

      function validateService(s) {
        var errors = {}, c = s.config;
        if (!s.noData && !s.requests.length) errors["data-requests"] = "请选择数据，或声明本服务不使用平台数据。";
        if (!s.noData) s.requests.forEach(function (r, i) {
          if (!r.fields.length) errors["req-" + i + "-fields"] = "请至少选择一个字段。";
          if (!r.purpose.trim()) errors["req-" + i + "-purpose"] = "请填写数据使用用途。";
          if (r.scope === "指定条件" && !r.scopeValue.trim()) errors["req-" + i + "-scopeValue"] = "请填写条件值。";
        });
        if (s.hosted) {
          var required = s.type === "Agent" ? ["goal", "prompt", "model"] : s.type === "MCP" ? ["entry"] : s.type === "Skill" ? ["packageName", "skillDescription", "instructions"] : ["taskName", "entry", "implementation", "idempotency"];
          if (s.type === "MCP") {
            if (!c.tools && !c.resources && !c.prompts) errors["cfg-capabilities"] = "请至少声明一种协议能力。";
            if (c.tools) required = required.concat(["toolName", "toolDescription", "toolHandler"]);
            if (c.resources) required = required.concat(["resourceUri", "resourceMime", "resourceHandler"]);
            if (c.prompts) required = required.concat(["promptName", "promptBody"]);
          }
          required.forEach(function (key) { if (!String(c[key] || '').trim()) errors["cfg-" + key] = "此项为必填内容。"; });
          var schemas = ["Agent", "Worker"].includes(s.type) ? ["inputSchema", "outputSchema"] : s.type === "MCP" && c.tools ? ["toolInput"].concat(String(c.toolOutput || '').trim() ? ["toolOutput"] : []) : [];
          schemas.forEach(function (key) {
            try {
              var schema = JSON.parse(c[key]);
              if (!schema || Array.isArray(schema) || schema.type !== "object" || (schema.properties && (typeof schema.properties !== "object" || Array.isArray(schema.properties)))) throw new Error("object schema required");
            } catch (e) { errors["cfg-" + key] = "请输入合法的对象 JSON Schema（type 为 object）。"; }
          });
          var numbers = s.type === "Agent" ? ["steps", "duration"] : s.type === "MCP" ? ["timeout"] : s.type === "Skill" ? [] : ["attemptTimeout", "totalTimeout", "attempts"];

          delete state.validationErrors[target.id];
          target.removeAttribute("aria-invalid");
          var error = document.getElementById(target.id + "-error");
          if (error) error.hidden = true;
        }
        return true;
      }
      document.addEventListener("input", function (event) {
        var target = event.target;
        if (target.id === "skill-new-path") state.skillPathEdited = true;
        if ((target.id === "new-service-name" || target.id === "new-service-desc") && target.value.trim()) {
          target.removeAttribute("aria-invalid");
          document.getElementById(target.id === "new-service-name" ? "new-service-error" : "new-service-desc-error").hidden = true;
        }
        if (target.id === "service-search") {
          state.query = target.value;
          render();
          var input = document.getElementById("service-search");
          input.focus();
          input.setSelectionRange(state.query.length, state.query.length);
        }
        if (target.id === "asset-search") {
          state.assetQuery = target.value;
          document.getElementById("asset-results").innerHTML = assetResults();
        }
        if (target.type !== "checkbox" && target.type !== "radio" && target.tagName !== "SELECT") updateDraftField(target);
      });

      document.addEventListener("change", function (event) {
        var target = event.target, data = target.dataset || {};
        if (target.id === "skill-new-kind") {
          var template = skillFileTemplates()[target.value];
          if (template && !state.skillPathEdited) document.getElementById("skill-new-path").value = template.path;
          return;
        }
        if (target.id === "type-filter") { state.type = target.value; render(); return; }
        if (target.id === "status-filter") { state.lifecycle = target.value; render(); return; }
        if (target.id === "new-hosted-yes" || target.id === "new-hosted-no") {
          state.selectedHosted = target.id === "new-hosted-yes";
          document.getElementById("creation-mode-field").hidden = !state.selectedHosted;
          document.getElementById("hosting-summary").textContent = state.selectedHosted ? "平台托管 · 数据需求 + 类型专属开发配置" : "非托管 · 仅配置数据需求并提交审核";
          return;
        }
        if (target.id === "creation-mode-ai" || target.id === "creation-mode-manual") { state.creationMode = target.id === "creation-mode-ai" ? "ai" : "manual"; return; }
        if (data.assetSelect) {
          state.assetSelection = state.assetSelection.filter(function (id) { return id !== data.assetSelect; });
          if (target.checked) state.assetSelection.push(data.assetSelect);
          document.getElementById("asset-error").hidden = true;
          return;
        }
        if (updateDraftField(target) && (["tools", "resources", "prompts", "trigger"].includes(data.config) || data.requestKey === "scope" || target.id === "service-no-data")) { state.validationErrors = {}; render(); }
      });

      document.addEventListener("click", function (event) {
        var target = event.target.closest("button");
        if (!target) return;
        if (target.disabled) return;
        if (target.dataset.scopeHelp) { showScopeHelp(target); return; }
        if (target.dataset.deleteService) { deleteService(target.dataset.deleteService); return; }
        if (target.dataset.variantStep) { switchVariant(Number(target.dataset.variantStep)); return; }
        if (target.dataset.toast !== undefined) { showToast(target.dataset.toast); return; }
        if (target.dataset.view) { state.view = target.dataset.view; render(); return; }
        if (target.hasAttribute("data-create-service")) { createServiceModal(); return; }
        if (target.dataset.configDrawer) {
          var configService = currentService();
          if (!configService.hosted || configService.creationMode !== "ai") return;
          if (state.aiConfigOpen && state.aiConfigSection === target.dataset.configDrawer) state.aiConfigOpen = false;
          else { state.aiConfigSection = target.dataset.configDrawer; state.aiConfigOpen = true; }
          render();
          return;
        }
        if (target.hasAttribute("data-close-config-drawer")) { state.aiConfigOpen = false; render(); return; }
        if (target.dataset.switchMode) { switchDevelopmentMode(target.dataset.switchMode); return; }
        if (target.dataset.requestAiChange) {
          var aiService = currentService();
          if (!aiService.hosted || aiService.creationMode !== "ai" || !editable(aiService) || target.dataset.requestAiChange === "versions") return;
          state.aiConfigSection = target.dataset.requestAiChange;
          state.assistantRequest = "请根据当前草稿调整" + (developmentSections(aiService).find(function (item) { return item[0] === state.aiConfigSection; }) || [null, "服务配置"])[1] + "。";
          state.proposal = true;
          state.aiConfigOpen = false;
          render();
          return;
        }
        if (target.dataset.skillFile && currentService().hosted && currentService().type === "Skill") {
          if (target.dataset.skillFile === "SKILL.md" || currentService().config.files.some(function (file) { return file.path === target.dataset.skillFile; })) { state.skillFile = target.dataset.skillFile; render(); }
          return;
        }
        if (target.dataset.skillCreate) { createSkillEntry(target.dataset.skillCreate); return; }
        if (target.hasAttribute("data-skill-rename")) { renameSkillFile(); return; }
        if (target.hasAttribute("data-skill-delete")) { deleteSkillEntry(state.skillFile, false); return; }
        if (target.dataset.skillRemoveDir) { deleteSkillEntry(target.dataset.skillRemoveDir, true); return; }
        if (target.hasAttribute("data-skill-reference")) { insertSkillReference(); return; }
        if (target.hasAttribute("data-skill-restore-legacy")) { restoreLegacySkillScript(); return; }
        if (target.hasAttribute("data-skill-ai")) { openSkillAssistant(); return; }
        if (target.dataset.createType) {
          state.selectedCreateType = target.dataset.createType;
          modalBody.querySelectorAll("[data-create-type]").forEach(function (button) {
            button.classList.toggle("active", button.dataset.createType === state.selectedCreateType);
            button.setAttribute("aria-pressed", String(button.dataset.createType === state.selectedCreateType));
          });
          return;
        }
        if (target.dataset.openService) { openService(target.dataset.openService); return; }
        if (target.dataset.pipelineType) { state.type = target.dataset.pipelineType; render(); return; }
        if (target.hasAttribute("data-select-assets")) { selectAssets(); return; }
        if (target.dataset.removeRequest !== undefined) {
          var service = currentService();
          if (!editable(service) || (service.hosted && service.creationMode === "ai")) return;
          service.requests.splice(Number(target.dataset.removeRequest), 1);
          state.validationErrors = {};
          markChanged(service);
          render();
          return;
        }
        if (target.hasAttribute("data-submit-service")) { releaseModal(); return; }
        if (target.hasAttribute("data-review-details")) { reviewDrawer(); return; }
        if (target.dataset.reviewSnapshot !== undefined) { reviewDrawer(Number(target.dataset.reviewSnapshot)); return; }
        if (target.dataset.reviewDecision) { decideReview(target.dataset.reviewDecision); return; }
        if (target.hasAttribute("data-new-revision")) { newRevision(); return; }
        if (target.hasAttribute("data-deploy-service")) { deployService(); return; }
        if (target.hasAttribute("data-reset-filter")) { state.query = ""; state.type = "全部类型"; state.lifecycle = "全部状态"; render(); return; }
        if (target.dataset.section) {
          if (currentService().hosted && currentService().creationMode === "ai") return;
          state.activeSection = target.dataset.section; render(); return;
        }
        if (target.dataset.editorTab) { state.editorTab = target.dataset.editorTab; render(); return; }
        if (target.hasAttribute("data-ai-generate")) {
          if (!currentService().hosted || currentService().creationMode !== "ai" || !editable(currentService())) return;
          var request = document.getElementById("ai-request");
          state.assistantRequest = request.value.trim() || "生成一项类型专属配置示例变更。";
          state.proposal = true;
          render();
          if (state.skillAssistantDrawer) openSkillAssistant();
          return;
        }
        if (target.hasAttribute("data-preview-diff")) { diffDrawer(); return; }
        if (target.hasAttribute("data-discard-proposal")) { state.proposal = false; render(); showToast("已放弃待采纳变更，草稿未修改"); return; }
        if (target.hasAttribute("data-accept-all")) { acceptProposal("全部 AI 变更已由开发者接受"); return; }
        if (target.hasAttribute("data-accept-selected")) {
          var selected = document.querySelectorAll("[data-diff-part]:checked").length;
          if (!selected) { showToast("请至少选择一项变更"); return; }
          acceptProposal("已接受 " + selected + " 项 AI 变更");
          return;
        }
        if (target.hasAttribute("data-save-draft")) { saveDraft(); return; }
        if (target.hasAttribute("data-run-test")) { testDrawer(); return; }
        if (target.hasAttribute("data-create-version")) { releaseModal(); return; }
        if (target.hasAttribute("data-create-app-version")) { state.app.draft = true; render(); showToast("数据应用新版本 v3.3.0 草稿已创建"); return; }
        if (target.hasAttribute("data-upgrade-agent")) { state.app.upgraded = true; render(); showToast("服务版本变更已加入应用草稿"); return; }
        if (target.hasAttribute("data-cancel-upgrade")) { state.app.upgraded = false; render(); showToast("服务版本变更已撤销"); return; }
        if (target.hasAttribute("data-submit-app")) {
          if (!state.app.upgraded) { showToast("当前应用版本没有待提交变更"); return; }
          submitApplication();
          return;
        }
        if (target.hasAttribute("data-approve-app")) { approveApplication(); return; }
        if (target.hasAttribute("data-rollback-app")) { rollbackApplication(); return; }
        if (target.hasAttribute("data-close-modal")) { closeModal(); return; }
        if (target.hasAttribute("data-close-drawer")) { closeDrawer(); return; }
      });

      modalLayer.querySelector(".mask").addEventListener("click", closeModal);
      function scopeHelpEnter(event) {
        var target = event.target.closest && event.target.closest("[data-scope-help], #scope-help-popover");
        if (!target) return;
        window.clearTimeout(scopeHelpTimer);
        if (target.dataset.scopeHelp) showScopeHelp(target);
      }
      function scopeHelpLeave(event) {
        if (!event.target.closest || !event.target.closest("[data-scope-help], #scope-help-popover")) return;
        if (event.relatedTarget && event.relatedTarget.closest && event.relatedTarget.closest("[data-scope-help], #scope-help-popover")) return;
        window.clearTimeout(scopeHelpTimer);
        scopeHelpTimer = window.setTimeout(hideScopeHelp, 120);
      }
      document.addEventListener("pointerover", scopeHelpEnter);
      document.addEventListener("pointerout", scopeHelpLeave);
      document.addEventListener("focusin", scopeHelpEnter);
      document.addEventListener("focusout", scopeHelpLeave);
      document.addEventListener("scroll", hideScopeHelp, true);
      if (window.addEventListener) window.addEventListener("resize", hideScopeHelp);
      document.addEventListener("toggle", function (event) {
        var target = event.target;
        if (target.dataset && target.dataset.skillDir !== undefined && workspace.contains(target)) state.skillCollapsed[target.dataset.skillDir] = !target.open;
      }, true);
      drawerLayer.querySelector(".mask").addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") hideScopeHelp();
        if (!compareMode) return;
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        var active = document.activeElement;
        if (active && (active.matches("input, textarea, select") || active.isContentEditable)) return;
        switchVariant(event.key === "ArrowRight" ? 1 : -1);
      });
      render();
    }());
  </script>
</body>
</html>
